# Dynamic Testing Suite for PMO AI SaaS
# Edit this file to add/update tests. The testing agent will read and execute these.
# Format: YAML with test cases organized by category

metadata:
  version: "1.0"
  production_url: "https://pmo-ai-saas.onrender.com"
  last_updated: "2026-07-31"
  maintained_by: "development-team"

# API Endpoint Tests
api_tests:
  - name: "Health Check"
    method: "GET"
    endpoint: "/api/health"
    expected_status: 200
    expected_body_contains: ["status", "ok"]
    tags: ["smoke", "critical"]

  - name: "Auth - Login Success"
    method: "POST"
    endpoint: "/api/auth/login"
    body:
      email: "test@example.com"
      password: "password123"
    expected_status: [200, 201]
    tags: ["auth", "critical"]

  - name: "Auth - Login Invalid Credentials"
    method: "POST"
    endpoint: "/api/auth/login"
    body:
      email: "wrong@example.com"
      password: "wrong"
    expected_status: 401
    tags: ["auth", "security"]

  - name: "Data - Get Projects"
    method: "GET"
    endpoint: "/api/data/projects"
    requires_auth: true
    expected_status: 200
    tags: ["data", "critical"]

  - name: "Analysis - Trigger Analysis"
    method: "POST"
    endpoint: "/api/analysis/trigger"
    requires_auth: true
    body:
      project_id: "test-project"
    expected_status: [200, 202]
    tags: ["analysis", "critical"]

  - name: "Team - Get Team Health"
    method: "GET"
    endpoint: "/api/team/health"
    requires_auth: true
    expected_status: 200
    tags: ["team", "data"]

# UI/E2E Tests
e2e_tests:
  - name: "Landing Page Loads"
    url: "/lara-landing.html"
    checks:
      - type: "element_exists"
        selector: "h1"
      - type: "text_contains"
        text: "LARA"
    tags: ["smoke", "landing"]

  - name: "Login Page Accessible"
    url: "/login"
    checks:
      - type: "element_exists"
        selector: "input[type='email']"
      - type: "element_exists"
        selector: "input[type='password']"
      - type: "element_exists"
        selector: "button[type='submit']"
    tags: ["smoke", "auth"]

  - name: "Dashboard Available After Login"
    url: "/dashboard"
    requires_auth: true
    checks:
      - type: "element_exists"
        selector: ".dashboard-container"
      - type: "page_title"
        contains: "Dashboard"
    tags: ["critical", "ui"]

  - name: "Project View Renders KPIs"
    url: "/project/test-project"
    requires_auth: true
    checks:
      - type: "element_exists"
        selector: "[data-testid='kpi-grid']"
      - type: "element_count_min"
        selector: ".kpi-card"
        minimum: 1
    tags: ["ui", "critical"]

# Database Query Tests
db_tests:
  - name: "Users Table Exists"
    query: "SELECT COUNT(*) FROM users"
    expects_result: true
    tags: ["schema", "data"]

  - name: "Projects Table Exists"
    query: "SELECT COUNT(*) FROM projects"
    expects_result: true
    tags: ["schema", "data"]

  - name: "Analyses Table Exists"
    query: "SELECT COUNT(*) FROM ai_analyses"
    expects_result: true
    tags: ["schema", "data"]

# Performance Tests
performance_tests:
  - name: "Login Response Time"
    endpoint: "/api/auth/login"
    method: "POST"
    max_response_time_ms: 2000
    tags: ["performance"]

  - name: "Dashboard Load Time"
    endpoint: "/api/data/projects"
    method: "GET"
    requires_auth: true
    max_response_time_ms: 3000
    tags: ["performance"]

# Smoke Test Suite (quick validation after deployments)
smoke_suite:
  - "Health Check"
  - "Landing Page Loads"
  - "Login Page Accessible"
  - "Data - Get Projects"

# Critical Test Suite (run before production release)
critical_suite:
  - "Health Check"
  - "Auth - Login Success"
  - "Auth - Login Invalid Credentials"
  - "Data - Get Projects"
  - "Dashboard Available After Login"
  - "Project View Renders KPIs"
  - "Users Table Exists"
  - "Projects Table Exists"

# Schedule for automated test runs
automation:
  smoke_tests:
    enabled: true
    schedule: "0 */6 * * *"  # Every 6 hours
    suites: ["smoke_suite"]

  critical_tests:
    enabled: true
    schedule: "0 2 * * *"  # Daily at 2 AM
    suites: ["critical_suite"]

  webhook_on_deploy:
    enabled: true
    endpoint: "/webhooks/render-deploy"
    runs: ["smoke_suite"]
