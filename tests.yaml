# ============================================
# AUTOMATION SCHEDULING
# ============================================
automation:
  smoke_tests:
    enabled: true
    schedule: "0 */6 * * *"
    suites: ["smoke_suite"]
    description: "Quick sanity checks every 6 hours"

  critical_tests:
    enabled: true
    schedule: "0 2 * * *"
    suites: ["critical_suite"]
    description: "Full regression daily at 2 AM"

  security_tests:
    enabled: true
    schedule: "0 3 * * 0"
    suites: ["security_suite"]
    description: "Deep security audit weekly (Sunday 3 AM)"

  exhaustive_tests:
    enabled: true
    schedule: "0 4 * * 0"
    suites: ["exhaustive_suite"]
    description: "Complete test run weekly (Sunday 4 AM)"

  webhook_on_deploy:
    enabled: true
    endpoint: "/api/testing/webhook"
    runs: ["smoke_suite", "critical_suite"]
    description: "Smoke + critical tests on each production deploy"
